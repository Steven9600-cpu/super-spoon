<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Spoon 计划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f9ff, #e8f2ff);
            font-family: "Microsoft Yahei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            margin-top: 40px;
            color: #2c5f9e;
            font-size: 42px;
            letter-spacing: 3px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #cupWrap {
            cursor: pointer;
            user-select: none;
        }
        /* 勺子动画 */
        #spoon {
            transform-origin: 140px 40px;
            transition: transform 0.18s ease-out;
        }
        #cupWrap.knock #spoon {
            animation: swing 0.3s ease;
        }
        @keyframes swing {
            0% { transform: rotate(0deg); }
            40% { transform: rotate(30deg); }
            70% { transform: rotate(-8deg); }
            100% { transform: rotate(0deg); }
        }
        .gongde-text {
            position: absolute;
            color: #d4380d;
            font-size: 28px;
            font-weight: bold;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.1); }
        }
        .count-box {
            margin-top: 10px;
            font-size: 24px;
            color:#1f4e79;
        }
        .btn-wrap {
            margin: 24px 0 40px;
        }
        .project-btn {
            padding: 12px 24px;
            border: none;
            background-color: #2c5f9e;
            color: white;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .project-btn:hover {
            background-color: #224a7d;
        }
        .byJim {
            position: fixed;
            right: 24px;
            bottom: 18px;
            font-size: 18px;
            color:#666;
        }
    </style>
</head>
<body>
    <h1>Super Spoon 计划</h1>
    <div class="container">
        <div id="cupWrap">
            <svg width="220" height="240" viewBox="0 0 220 240">
                <!-- 杯子 -->
                <path d="M50 70 L65 210 Q67 225 82 225 L138 225 Q153 225 155 210 L170 70 Z"
                      fill="#b9d8f5" stroke="#4477aa" stroke-width="3"/>
                <ellipse cx="110" cy="70" rx="60" ry="12" fill="#d8e9f9" stroke="#4477aa" stroke-width="3"/>
                <!-- 杯柄 -->
                <path d="M170 95 C195 95, 195 155, 170 155" fill="none" stroke="#4477aa" stroke-width="4"/>
                <!-- 勺子 -->
                <g id="spoon">
                    <line x1="155" y1="35" x2="105" y2="82" stroke="#888" stroke-width="6"/>
                    <ellipse cx="98" cy="88" rx="14" ry="18" fill="#c9c9c9" stroke="#777" stroke-width="2"/>
                </g>
            </svg>
        </div>
    </div>
    <div class="count-box">功德总数：<span id="num">0</span></div>
    <div class="btn-wrap">
        <a href="https://github.com/Steven9600-cpu/super-spoon" target="_blank">
            <button class="project-btn">前往项目主页</button>
        </a>
    </div>
    <div class="byJim">by Jim</div>

    <script>
        const cupWrap = document.getElementById('cupWrap');
        const numSpan = document.getElementById('num');
        let gongde = 0;
        let audioCtx = null;
        // 随机文字库
        const words = [
            "功德加一",
            "福气加一",
            "实力加一",
            "好运加一",
            "灵感加一"
        ];

        // 生成叮当音效
        function playDing() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        cupWrap.addEventListener('click', function(e){
            gongde++;
            numSpan.innerText = gongde;
            cupWrap.classList.remove('knock');
            void cupWrap.offsetWidth;
            cupWrap.classList.add('knock');
            playDing();

            // 随机选一句
            const randomText = words[Math.floor(Math.random() * words.length)];
            const txt = document.createElement('div');
            txt.className = 'gongde-text';
            txt.innerText = randomText;
            const container = document.querySelector('.container');
            const rect = cupWrap.getBoundingClientRect();
            const cRect = container.getBoundingClientRect();
            txt.style.left = (rect.left - cRect.left + 70) + 'px';
            txt.style.top = (rect.top - cRect.top + 20) + 'px';
            container.appendChild(txt);
            setTimeout(()=>txt.remove(),1000);
        })
    </script>
</body>
</html>
