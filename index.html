<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到 GitHub, 黄景辉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 40px 30px;
        }
        .octocat {
            font-size: 80px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 16px;
        }
        .name {
            color: #58a6ff;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #f0f6fc;
            text-decoration: none;
            background-color: #21262d;
            transition: all 0.25s ease;
        }
        .btn:hover {
            border-color: #58a6ff;
            background-color: #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="octocat">🐙</div>
        <h1>欢迎，<span class="name">黄景辉</span>！</h1>
        <p>很高兴你来到 GitHub，开启你的代码之旅 ✨</p>
        <a href="https://github.com" target="_blank" class="btn">前往 GitHub</a>
    </div>
</body>
</html>
